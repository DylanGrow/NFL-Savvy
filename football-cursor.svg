<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <!-- Leather Gradient -->
    <linearGradient id="leather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="40%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <g transform="translate(16, 16) rotate(45)">
      <!-- Outer outline -->
      <path d="M-17,0 C-11,-9.5 11,-9.5 17,0 C11,9.5 -11,9.5 -17,0 Z" 
            fill="url(#leather)" 
            stroke="#1c0a00" 
            stroke-width="1.8" 
            stroke-linejoin="round"/>

      <!-- Top highlight specular curve -->
      <path d="M-13,-2 C-7,-7 7,-7 13,-2" 
            fill="none" 
            stroke="#f59e0b" 
            stroke-width="0.8" 
            stroke-opacity="0.45"/>

      <!-- White Tip Stripes -->
      <path d="M-12.5,-5 C-11,-1.5 -11,1.5 -12.5,5" 
            stroke="#ffffff" 
            stroke-width="1.8" 
            stroke-linecap="round" 
            fill="none"/>
      <path d="M12.5,-5 C11,-1.5 11,1.5 12.5,5" 
            stroke="#ffffff" 
            stroke-width="1.8" 
            stroke-linecap="round" 
            fill="none"/>

      <!-- Center Laces -->
      <line x1="-6.5" y1="0" x2="6.5" y2="0" 
            stroke="#ffffff" 
            stroke-width="1.6" 
            stroke-linecap="round"/>
      <line x1="-4.5" y1="-2.8" x2="-4.5" y2="2.8" 
            stroke="#ffffff" 
            stroke-width="1.4" 
            stroke-linecap="round"/>
      <line x1="-1.5" y1="-2.8" x2="-1.5" y2="2.8" 
            stroke="#ffffff" 
            stroke-width="1.4" 
            stroke-linecap="round"/>
      <line x1="1.5" y1="-2.8" x2="1.5" y2="2.8" 
            stroke="#ffffff" 
            stroke-width="1.4" 
            stroke-linecap="round"/>
      <line x1="4.5" y1="-2.8" x2="4.5" y2="2.8" 
            stroke="#ffffff" 
            stroke-width="1.4" 
            stroke-linecap="round"/>
    </g>
  </g>

  <!-- Precise pointer tip indicator dot -->
  <circle cx="3" cy="3" r="1.5" fill="#f8fafc" stroke="#0f172a" stroke-width="0.75"/>
</svg>
